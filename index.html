<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskmaster</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/toolbar.css">
    <link rel="stylesheet" href="styles/project-detail-view.css">
    <link rel="stylesheet" href="styles/project-properties-view.css">
    <link rel="stylesheet" href="styles/subprojects-view.css">
    <link rel="stylesheet" href="styles/tasks-view.css">
    <link rel="stylesheet" href="styles/project-tree-view.css">
    <link rel="stylesheet" href="styles/message-view.css">
    <link rel="stylesheet" href="styles/summary-page.css">
    <script type="module" src="app.js" defer></script>
</head>

<body>
    <div class="app-body">

        <!-- Home Pagge -->
        <div id="home-page">

            <!-- Toolbar -->
            <div id="toolbar" class="toolbar"></div>

            <!-- Main Content -->
            <div class="content">

                <!-- ProjectTree View -->
                <div id="project-tree-view"></div>

                <!-- Project Detail View -->
                <div id="project-detail-view">
                    <div id="project-properties-view"></div>

                    <!-- Subprojects View -->
                    <div id="subprojects-view"></div>

                    <!-- Tasks View -->
                    <div id="tasks-view"></div>
                </div>

            </div>

            <!-- Error View -->
            <div id="message-view"></div>

        </div>


        <!-- Summary Page -->
        <div id="summary-page">

        </div>


    </div>
</body>

</html>
