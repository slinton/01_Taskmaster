<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskmaster test: tree view</title>
  <link rel="stylesheet" href="tests.css">
  <link rel="stylesheet" href="../styles/tree-view.css">
  <style>
    /* Test page only: tree on the left, what was selected on the right. */
    body { margin: 1rem; }
    .layout { display: flex; gap: 2rem; align-items: flex-start; }
    #tree { min-width: 22rem; }
    #readout { margin: 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Tree view</h1>
  <div class="layout">
    <div id="tree" class="tree-view"></div>
    <pre id="readout">Click a row, or use the arrow keys and Enter.</pre>
  </div>

  <script type="module">
    import { loadRoot } from "./load-data.js";
    import { TreeView } from "../views/tree-view.js";

    const treeElement = document.getElementById("tree");
    const readout = document.getElementById("readout");

    try {
      const root = await loadRoot("./sample-data/taskmaster.json");
      window.root = root; // try root.find("orbit") in the console

      // Stand-in for the app: it remembers the selection and redraws the view.
      let selection = null;
      const view = new TreeView(treeElement, {
        onSelect(newSelection) {
          selection = newSelection;
          view.render(root, { selection });
          readout.textContent = describe(newSelection);
        },
      });

      view.render(root, { selection });

      // Show what the app would hand to a detail panel.
      function describe({ kind, id }) {
        if (kind === "project") {
          const project = root.find(id);
          return [
            `Selected project: ${project.name}`,
            `Path: ${project.path.map((p) => p.name).join(" > ")}`,
            `Tasks: ${project.tasks.length} (${project.allTasks.length} including subprojects)`,
            `Subprojects: ${project.children.length}`,
          ].join("\n");
        }
        const task = root.findTask(id);
        return [
          `Selected task: ${task.title}`,
          `In project: ${task.project.path.map((p) => p.name).join(" > ")}`,
          `Completed: ${task.completed}`,
        ].join("\n");
      }
    } catch (error) {
      treeElement.textContent = error.message;
    }
  </script>
</body>
</html>
