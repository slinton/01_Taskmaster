<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TasksView</title>
 
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/project-detail-view.css">
    <link rel="stylesheet" href="../styles/tasks-view.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

    <style>
        hr {
            margin: 1rem 0;
            border: 1px solid #ccc;
        }

        #error-view {
            font-size: 1rem;
            color: red;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="app-body">
        <h1>Test TasksView</h1>
        <div id="tasks-view"></div>
        <div id="error-view"></div>
    </div>

    <script type="module">
        import { Project } from '../models/project.js';
        import { Task } from '../models/task.js';
        import { TasksView } from '../views/tasks-view.js';
        import { EventBus } from '../services/event-bus.js';

        function runTest() {
            const project = createProject();
            const tasksView = new TasksView();

            tasksView.render();
            const eventBus = EventBus.instance;
            eventBus.publish('project-selected', project);

        }

        function showError(error) {
            const errorView = document.querySelector('#error-view');
            errorView.textContent = `Error: ${error.message}`;
        }

        function createProject() {
            const project = new Project('Home');
            try {
                project.addTask(new Task('Task 1'));
                project.addTask(new Task('Task 2'));
                project.addSubproject(new Project('Subproject 1'));
                project.addSubproject(new Project('Subproject 2'));
            } catch (error) {
                console.error(error);
                showError(error);
                return;
            }
            return project;
        }

        runTest();

    </script>
</body>

</html>
