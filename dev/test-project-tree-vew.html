<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Subprojects View</title>
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/project-tree-view.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <style>
        hr {
            margin: 1rem 0;
            border: 1px solid #ccc;
        }

        #error-view {
            font-size: 1rem;
            color: red;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="app-body">
        <h1>Test ProjectTreeView</h1>
        <div id="project-tree-view"></div>
        <div id="error-view"></div>
    </div>

    <script type="module">
        import { ProjectTree } from '../models/project-tree.js';
        import { Project } from '../models/project.js';
        import { Task } from '../models/task.js';
        import { ProjectTreeView } from '../views/project-tree-view.js';
        import { EventBus } from '../services/event-bus.js';

        function runTest() {
            const project = createProject();
            const projectTree = new ProjectTree(project);
            const projectTreeView = new ProjectTreeView('project-tree-view', projectTree);
            const eventBus = EventBus.instance;
            eventBus.publish('project-selected', project);
            projectTreeView.render();
        }

        function showError(error) {
            const errorView = document.querySelector('#error-view');
            errorView.textContent = `Error: ${error.message}`;
        }

        function createProject(i = 0, depth = 3) {
            const project = i == 0 ? new Project('Home') : new Project(`Project ${i}`);
            try {
                project.addTask(new Task('Task 1'));
                project.addTask(new Task('Task 2'));
                if (depth > 1) {
                    project.addSubproject(createProject(i + 1, depth - 1));
                    project.addSubproject(createProject(i + 4, depth - 1));
                }
            } catch (error) {
                console.error(error);
                showError(error);
                return;
            }
            return project;
        }

        runTest();

    </script>
</body>

</html>
